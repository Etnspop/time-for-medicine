name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/medication-tracker-app-r9s672"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的會取代進行中的
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 第一次會自動啟用 Pages（enablement: true），不需手動到設定開啟
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 整個專案就是靜態網站，直接上傳根目錄
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
